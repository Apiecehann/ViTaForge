save_dir: ./data

decimation: 1

save_frequency: 2
video_frequency: 2
render_frequency: 0  # 与 HDMI(demo.yml) 对齐; 0 = headless 录制(不弹 GUI 窗口)

random_texture: false

use_seed: true
episode_num: 1
start_seed: 0
max_seed: 3

sensor_type: gsmini

observations:
  camera: ['rgb']
  tactile: ['rgb', 'rgb_marker', 'marker', 'depth', 'pose']
  embodiment: ['joint', 'ee']
  actor: true

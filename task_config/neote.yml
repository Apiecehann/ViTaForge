save_dir: ./data

decimation: 1

save_frequency: 2
video_frequency: 2
render_frequency: 0

random_texture: false

use_seed: true
episode_num: 5

sensor_type: neote
dense_gelpad: false
force_field_grid: [64, 48]

observations:
  camera: ['rgb']
  tactile:
    - rgb
    - rgb_marker
    - marker
    - depth
    - pose
    - vertex_force
    - force_field
    - gel_particle
  embodiment: ['joint', 'ee']
  actor: true

save_pre_move: true
tactile_video_key: gel_particle
